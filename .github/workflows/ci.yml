name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the five engines (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: All five import in one process
        run: python -c "import perspective, QuantLib, ORE, skfolio, nautilus_trader; print('ok')"
      - name: Fast tests
        run: python -m pytest -q -m "not slow"
      - name: Slow end-to-end tests (ORE simulation, full backtest)
        run: python -m pytest -q -m slow
